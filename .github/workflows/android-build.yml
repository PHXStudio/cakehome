name: Android Build (Cloud)

# 手动触发：Actions → Android Build (Cloud) → Run workflow
# 签名：默认 Unity debug keystore（可直接装测试机）；如需发布签名，配置 secrets:
#   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASS / ANDROID_KEY_ALIAS / ANDROID_KEY_PASS
on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-Android-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-${{ runner.os }}-

      # 下载 Unity 编辑器（GameCI 托管，Linux 装到 /opt/unity 或默认路径）
      - name: Download Unity Editor
        uses: game-ci/unity-downloader@main
        with:
          unityVersion: 2022.3.62f3
          skipLicensingCheck: true

      - name: Activate Unity (Personal, entitlement)
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          UNITY="$(ls /opt/unity*/Editor/Unity /Applications/Unity/Hub/Editor/2022.3.62f3/Unity.app/Contents/MacOS/Unity 2>/dev/null | head -1)"
          "$UNITY" -batchmode -nographics -quit \
            -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" \
            -logFile /tmp/unity-activate.log || echo "activate returned non-zero (may already be activated)"

      - name: Build Android APK (Unity)
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          UNITY="$(ls /opt/unity*/Editor/Unity 2>/dev/null | head -1)"
          "$UNITY" -batchmode -quit -projectPath . \
            -buildTarget Android \
            -executeMethod BuildAndroid.Build \
            -logFile /tmp/unity-build.log
          echo "===== BUILD LOG TAIL ====="
          tail -30 /tmp/unity-build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CakeHome-Android
          path: builds/android
          if-no-files-found: error
