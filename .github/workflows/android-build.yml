name: Android Build (Cloud)

# 手动触发：Actions → Android Build (Cloud) → Run workflow
# 必需 secret：UNITY_LICENSE（Unity Personal 激活 .ulf 的 base64）
#   获取：Unity -createManualActivationFile 生成 .alf → license.unity3d.com/manual 上传（选 Personal）→ 下载 .ulf
# 签名：默认 Unity debug keystore；发布签名配置 secrets:
#   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASS / ANDROID_KEY_ALIAS / ANDROID_KEY_PASS
on:
  workflow_dispatch:
    inputs:
      sign_apk:
        description: 'Sign APK with release keystore (needs keystore secrets)'
        type: boolean
        default: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-Android-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-${{ runner.os }}-

      # Unity 云构建（unity-builder 自动下载 Unity + Android 模块 + 处理 SDK）
      - name: Build Android APK (Unity)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: Android
          projectPath: .
          unityVersion: 2022.3.62f3
          buildMethod: BuildAndroid.Build
          buildName: CakeHome
          buildPath: builds/android
          allowDirtyBuild: true
          androidExportType: androidPackage

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CakeHome-Android
          path: builds/android
          if-no-files-found: error
