name: iOS Build (Cloud)

# 手动触发：Actions → iOS Build (Cloud) → Run workflow
# Unity Personal 激活：UNITY_EMAIL + UNITY_PASSWORD 直激活（新版 entitlement，无需 .ulf/序列号）
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        type: choice
        options: [Debug, Release]
        default: Debug
      sign_ipa:
        description: 'Sign & package IPA (needs Apple certs secrets)'
        type: boolean
        default: false

jobs:
  build-ios:
    runs-on: macos-13
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-iOS-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-${{ runner.os }}-

      # 下载 Unity 编辑器（GameCI 托管，自动装到 /Applications/Unity/Hub/Editor）
      - name: Download Unity Editor
        uses: game-ci/unity-downloader@v0.2
        with:
          unityVersion: 2022.3.62f3
          skipLicensingCheck: true

      - name: Activate Unity (Personal, entitlement)
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          UNITY="/Applications/Unity/Hub/Editor/2022.3.62f3/Unity.app/Contents/MacOS/Unity"
          "$UNITY" -batchmode -nographics -quit \
            -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" \
            -logFile /tmp/unity-activate.log || echo "activate returned non-zero (may already be activated)"

      - name: Build iOS Xcode project (Unity)
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          UNITY="/Applications/Unity/Hub/Editor/2022.3.62f3/Unity.app/Contents/MacOS/Unity"
          "$UNITY" -batchmode -quit -projectPath . \
            -buildTarget iOS \
            -executeMethod BuildIOS.Build \
            -logFile /tmp/unity-build.log
          echo "===== BUILD LOG TAIL ====="
          tail -30 /tmp/unity-build.log

      # 签名 + 出 IPA（可选，触发时勾 sign_ipa）
      - name: Sign & package IPA (optional)
        if: ${{ inputs.sign_ipa }}
        uses: game-ci/unity-ios-sign@v0
        with:
          provisioningProfileBase64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          certificateBase64: ${{ secrets.IOS_CERTIFICATE }}
          certificatePassword: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          projectPath: builds/ios

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: CakeHome-iOS-${{ inputs.configuration }}
          path: builds/ios
          if-no-files-found: error
